; SimBridge dialplan
;
; Mirrors the production 3p14-aaa dialplan (verified 2026-08-15) with
; the P0-3 RCE fixes applied:
;   - no SHELL(): the old blacklist check interpolated the caller ID
;     (user-controlled, spoofable from the GSM network) into
;     `grep -c "^${CALLER}$" ...`;
;   - no System() with interpolated user data: caller IDs and SMS
;     texts reached /usr/local/bin/tg-*-forward.sh shell scripts.
;
; User data reaches the network only as JSON bodies built by the AGI
; scripts. In the dialplan it appears exclusively as channel
; variables (SET here, GET VARIABLE in the AGI script) — channel
; variables are visible via AMI/CLI, so secrets never go through
; them; secrets come from the process environment (Asterisk's
; EnvironmentFile).
;
; Globals (RING_WAIT_SECONDS, MAX_RECORD_SECONDS, VM_PROMPT,
; PROMPT_DURATION, VM_REC_DIR, USERBOT_URL, BLACKLIST_PATH,
; MODEM_ID, EARLY_HANGUP_MAX_SECONDS, BRIDGE_ENDPOINT,
; OUTBOUND_GSM_RING_SECONDS) are generated by
; scripts/generate_asterisk_config.py from simbridge.yaml. The
; generated file MUST exist before this dialplan is loaded (a missing
; #include aborts dialplan loading) — install order: generate, then
; (re)load Asterisk.
#include => asterisk-globals.conf

[incoming-city]
exten = _X.,1,NoOp(Incoming city call from ${CALLERID(num)})
 same = n,Hangup()

[incoming-mobile]
; ---------- Incoming voice call ----------
exten => s,1,NoOp(=== INCOMING VOICE CALL from ${CALLERID(num)} ===)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(BL_PATH=${BLACKLIST_PATH})
 same => n,AGI(tg-blacklist-agi.py)
 same => n,GotoIf($["${BL_BLOCKED}" = "1"]?blacklisted)
 same => n,Set(SMS_FROM=${CALLER})
 same => n,Set(FWD_URL=${USERBOT_URL})
 same => n,Set(MODEM_ID=${MODEM_ID})
 same => n,Set(EH_MAX=${EARLY_HANGUP_MAX_SECONDS})
 same => n,Set(VM_PROMPT_DURATION=${PROMPT_DURATION})
 same => n,AGI(tg-sms-agi.py,ring)
 ; Stage 04: register the call in the agent, then ring the Telegram
 ; user through the bridge (PJSIP UAS). The GSM channel stays
 ; UNANSWERED while the user is being called, so the GSM caller hears
 ; real carrier ringback. Accept -> Dial auto-answers the GSM channel
 ; and bridges the media; reject -> BUSY; timeout -> NOANSWER -> the
 ; voicemail branch below. If the TG user hangs up the SIP leg, this
 ; channel dies and the Dial app tears down the rest (apps/app_dial.c
 ; hanguptree) — no orphan legs. The complete AGI reports the final
 ; outcome to the agent (state machine + userbot notification);
 ; DIALSTATUS is final here because Dial blocks for the whole call.
 same => n,AGI(notify-agent-agi.py,incoming,${CALLER})
 same => n,Dial(SIP/${BRIDGE_ENDPOINT},${RING_WAIT_SECONDS})
 same => n,AGI(notify-agent-agi.py,complete,${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?voicemail)
 same => n,Hangup()

exten => blacklisted,1,NoOp(Blacklisted number ${CALLER})
 same => n,Busy(5)
 same => n,Hangup()

; ---------- Voicemail fallback branch (S03.1 + S03.4) ----------
; Named, same-context branch: Goto(voicemail,1) keeps the channel in
; [incoming-mobile], so the h-exten below (hangup -> forward) still
; applies. Stage 04 reaches it on Dial NOANSWER (the Telegram ring
; timed out); the agent records the VOICEMAIL state via /complete
; before the Goto.
;
; S03.1: MixMonitor starts BEFORE Playback, so the audio is captured
; from the moment the channel answers — a caller who hangs up during
; the greeting leaves a recording and a notification. The greeting
; is therefore at the front of the WAV; the AGI path trims the first
; PROMPT_DURATION seconds before sending (core/voicemail_forward.py
; — stated choice: trim, not accept) and classifies speech time.
exten => voicemail,1,Answer()
 same => n,Set(VMFILE=${VM_REC_DIR}/vm-${UNIQUEID}.wav)
 same => n,MixMonitor(${VMFILE})
 same => n,Playback(${VM_PROMPT})
 same => n,Wait(${MAX_RECORD_SECONDS})
 same => n,StopMixMonitor()
 same => n,Hangup()

; ---------- After the call ends ----------
; Runs when the channel hangs up: the caller hung up mid-recording
; (Wait interrupted) or the record timeout finished.
;
; StopMixMonitor() finalizes the WAV synchronously — Asterisk 18
; app_mixmonitor.c: "closing the filestream here guarantees the file
; is available to the dialplan after calling StopMixMonitor". On a
; timed-out call it is a no-op (already stopped in the voicemail
; branch).
;
; AGI() supports hungup channels ("dead mode") and GET VARIABLE is a
; dead-safe AGI command (both verified in the Asterisk 18 source,
; res/res_agi.c). Channel variables persist into the h-exten, so
; VMFILE/CALLER/FWD_URL/EH_MAX/VM_PROMPT_DURATION are still visible.
;
; Why this shape:
;   - the old production System(tg-voice-forward.sh "${CALLER}" ...)
;     was an RCE (P0-3);
;   - it forwarded a NOT-YET-FINALIZED WAV on mid-recording hangup
;     (ffmpeg failed on the zero-size header and the script deleted
;     the file — the voicemail was lost);
;   - the old Set(CHANNEL(hangup_handler_wipe)=incoming-mobile,h,1)
;     was an invalid handler spec (the value must be an application
;     invocation, not a dialplan target) — a silent no-op.
;     This h-exten is the actual mechanism.
exten => h,1,NoOp(Hangup handler)
 same => n,StopMixMonitor()
 same => n,GotoIf($["${VMFILE}" = ""]?nvm)
 same => n,GotoIf($[${STAT(e,${VMFILE})} = 0]?nvm)
 same => n,AGI(tg-voice-agi.py)
 same => n(nvm),GotoIf($["${CALL_ID}" = ""]?end)
 ; Stage 04: the channel died mid-call (either party hung up). Dead
 ; mode — DIALSTATUS is stale here, so the status is passed
 ; explicitly as ENDED. The agent closes the state machine and
 ; notifies the userbot (this is what ends the Telegram leg when the
 ; GSM side hung up first); 404 (already terminal) is a no-op.
 same => n,AGI(notify-agent-agi.py,complete,ENDED)
 same => n(end),Hangup()

; ---------- SMS ----------
; Blacklist check first (S02.2): a blacklisted sender's SMS must not
; reach Telegram — the same mechanism as the incoming-voice path.
exten => sms,1,NoOp(=== INCOMING SMS ===)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(BL_PATH=${BLACKLIST_PATH})
 same => n,AGI(tg-blacklist-agi.py)
 same => n,GotoIf($["${BL_BLOCKED}" = "1"]?blacklisted)
 same => n,Set(SMS_FROM=${CALLER})
 same => n,Set(SMS_TEXT=${BASE64_DECODE(${SMS_BASE64})})
 same => n,Set(FWD_URL=${USERBOT_URL})
 same => n,Set(MODEM_ID=${MODEM_ID})
 same => n,AGI(tg-sms-agi.py,sms)
 same => n,Hangup()

 same => n(blacklisted),NoOp(Blacklisted SMS from ${CALLER} — not forwarded)
 same => n,Hangup()

; ---------- Delivery report ----------
; The report is itself an SMS (from the carrier short code), so
; SMS_BASE64 carries the raw report text. The AGI posts it to the
; AGENT (AGENT_URL from the process environment), not the userbot.
exten => report,1,NoOp(=== SMS DELIVERY REPORT ===)
 same => n,Set(SMS_FROM=${CALLERID(num)})
 same => n,Set(SMS_TEXT=${BASE64_DECODE(${SMS_BASE64})})
 same => n,Set(MODEM_ID=${MODEM_ID})
 same => n,AGI(tg-sms-agi.py,report)
 same => n,Hangup()

; ---------- USSD ----------
exten => ussd,1,NoOp(USSD on ${DONGLENAME})
 same => n,Set(SMS_FROM=${DONGLENAME})
 same => n,Set(SMS_TEXT=${BASE64_DECODE(${USSD_BASE64})})
 same => n,Set(FWD_URL=${USERBOT_URL})
 same => n,Set(MODEM_ID=${MODEM_ID})
 same => n,AGI(tg-sms-agi.py,ussd)
 same => n,Hangup()

[internal]
exten = _X.,1,NoOp(Internal call to ${EXTEN})
 same = n,Hangup()

[sms-send]
exten => _X.,1,NoOp(Sending SMS with report to ${EXTEN})
 same => n,DongleSendSMS(${MODEM_ID},${EXTEN},"${SMS_TEXT}",1440,yes,${SMS_PAYLOAD})
 same => n,Hangup()

exten => _+X.,1,NoOp(Sending SMS with report to ${EXTEN})
 same => n,DongleSendSMS(${MODEM_ID},${EXTEN},"${SMS_TEXT}",1440,yes,${SMS_PAYLOAD})
 same => n,Hangup()

; ---------- Outgoing GSM leg (Stage 04) ----------
; The bridge (UAC side) INVITEs this node when a Telegram user accepts
; an outgoing call: From-user = <endpoint>, Request-URI user = target
; number -> this context, EXTEN = target. The SIP channel executes
; this dialplan, so when the TG user hangs up the channel dies and
; the Dial app cancels/hangs up the Dongle leg (apps/app_dial.c
; hanguptree / main/dial.c ast_dial_destroy) — no orphan GSM call to
; the target. The TG user hears the target's real ringback while the
; GSM leg rings (two-party bridge passes in-band ringback).
; Inbound SIP auth (generated pjsip.conf) is mandatory: without it
; anyone who can reach this transport could dial arbitrary GSM
; numbers through the modem.
exten => _X.,1,NoOp(Outgoing TG call — GSM leg to ${EXTEN})
 same => n,Answer()
 same => n,AGI(notify-agent-agi.py,outgoing-accepted)
 ; The agent may have already expired this call (TG ring timeout with
 ; a late accept): /outgoing/accepted returns 404 -> CALL_ID stays
 ; empty -> do NOT dial the target number.
 same => n,GotoIf($["${CALL_ID}" = ""]?nocal)
 same => n,Dial(Dongle/${MODEM_ID}/${EXTEN},${OUTBOUND_GSM_RING_SECONDS})
 same => n,AGI(notify-agent-agi.py,complete,${DIALSTATUS})
 same => n,Hangup()
 same => n(nocal),NoOp(Outgoing TG call expired before accept — not dialing)
 same => n,Hangup()

exten => h,1,NoOp(tg-bridge hangup handler)
 same => n,AGI(notify-agent-agi.py,complete,ENDED)
 same => n,Hangup()
