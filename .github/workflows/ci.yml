name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest tests/ -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history — a secret removed in a later commit is still in history
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Working-tree secret scan
        run: python3 core/secrets_check.py $(git ls-files)
      - name: Full git-history secret scan
        run: python3 scripts/scan_history_secrets.py
